name: plate_keypad
description: "The optional on-screen keypad and slot picker for the core_plate library — a soft keyboard for hosts that do not render their own."
version: 0.1.0
homepage: https://github.com/ArAdBey/plate-number

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # The country-neutral engine, for PlateAlphabet.
  core_plate: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0

# Local development only: resolve core_plate from the sibling checkout until it
# is published. pub.dev ignores dependency_overrides for consumers — they get
# the versioned `core_plate: ^0.1.0` above. Safe to delete once core_plate is
# on pub.dev.
dependency_overrides:
  core_plate:
    path: ../core_plate
