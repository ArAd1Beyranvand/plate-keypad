name: plate_keypad
description: "The optional on-screen keypad and slot picker for the core_plate library — a soft keyboard for hosts that do not render their own."
version: 0.1.0
homepage: https://github.com/ArAdBey/plate-number

# Path-only, not published (PLAN.md §6.6, settled in P9). The core dependency
# resolves against the sibling checkout `../core-plate`.
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # The country-neutral engine, for PlateAlphabet.
  core_plate:
    path: ../core-plate

dev_dependencies:
  flutter_lints: ^6.0.0
